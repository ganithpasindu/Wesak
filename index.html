<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - Full Setup</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* කැමරාව ඕනෑවට වඩා Zoom වීම වැළැක්වීමට CSS */
        body { margin: 0; overflow: hidden; }
        
        #arjs-video {
            object-fit: cover !important; /* මුළු screen එකම වැසෙන සේ සකසයි */
            width: 100vw !important;
            height: 100vh !important;
        }

        /* Loading Screen එක සඳහා (අවශ්‍ය නම් පමණි) */
        .arjs-loader {
            height: 100%; width: 100%; position: absolute; top: 0; left: 0;
            background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
    </style>
</head>

<body>
    <a-scene 
        embedded 
        arjs="sourceType: webcam; 
              debugUIEnabled: false; 
              displayWidth: 1280; 
              displayHeight: 720; 
              destWidth: 1280; 
              destHeight: 720;
              trackingMethod: best;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="myModel" src="model.glb"></a-asset-item>
        </a-assets>

        <a-marker type="pattern" url="pattern-marker.patt">
            
            <a-entity 
                gltf-model="#myModel" 
                scale="0.1 0.1 0.1" 
                position="0 0 0" 
                rotation="0 0 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>
</body>
</html>
