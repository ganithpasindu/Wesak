<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>Vesak Kuduwa AR - Hiro Marker</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-assets>
            <a-asset-item id="kuduwa-file" src="vesak_kuduwa.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            
            <a-entity 
                gltf-model="#kuduwa-file" 
                scale="5 5 5" 
                position="0 0.5 0">
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>

    <script>
        // මොඩලය ලෝඩ් වුණාද කියා පරීක්ෂා කිරීමට
        const model = document.querySelector('#kuduwa-file');
        
        model.addEventListener('loaded', function () {
            console.log("වෙසක් කුඩුව සාර්ථකව ලෝඩ් වුණා!");
        });

        model.addEventListener('error', function () {
            alert("දෝෂයකි: 'vesak_kuduwa.glb' ෆයිල් එක හමු නොවීය. File name එක නිවැරදිදැයි බලන්න.");
        });
    </script>

</body>
</html>
