<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesak Kuduwa AR 2026</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body { margin: 0; background-color: #1a1a1a; font-family: sans-serif; }
        
        /* Model Viewer එක පෝන් එකේ screen එක පුරාම පෙන්වීමට */
        model-viewer {
            width: 100%;
            height: 100vh;
            background-color: #000;
        }

        /* AR බොත්තම ලස්සන කරන්න */
        #ar-button {
            background-color: #ff9800;
            border-radius: 30px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <model-viewer 
        src="vesak_kuduwa.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        shadow-intensity="2" 
        exposure="1" 
        environment-image="neutral"
        autoplay>
        
        <button slot="ar-button" id="ar-button">
            View in AR (වෙසක් කුඩුව බලන්න)
        </button>

    </model-viewer>

</body>
</html>
