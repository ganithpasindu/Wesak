<!DOCTYPE html>
<html>
<head>
    <title>Vesak Kuduwa AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-assets>
            <a-asset-item id="kuduwa-file" src="vesak_kuduwa.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            
            <a-entity 
                gltf-model="#kuduwa-file" 
                scale="0.5 0.5 0.5" 
                position="0 0.5 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>

    <script>
        // මොඩලය ලෝඩ් වුණාද කියා පරීක්ෂා කිරීමට සරල ක්‍රමයක්
        document.querySelector('#kuduwa-file').addEventListener('loaded', function () {
            alert("වෙසක් කුඩුව සූදානම්! දැන් Hiro Marker එකට අල්ලන්න.");
        });

        document.querySelector('#kuduwa-file').addEventListener('error', function () {
            alert("Error: .glb file එක සොයාගත නොහැක. File name එක පරීක්ෂා කරන්න.");
        });
    </script>

</body>
</html>
