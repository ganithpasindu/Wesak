<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>වෙසක් කුඩුව AR - Three.js</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <script>
        // 1. මූලික විචල්‍යයන් (Global Variables)
        let scene, camera, renderer, clock, arToolkitSource, arToolkitContext;
        let kuduwaModel;

        init();
        animate();

        function init() {
            // --- Scene එක සැකසීම ---
            scene = new THREE.Scene();

            // ආලෝකය ලබාදීම (කුඩුව පැහැදිලිව පෙනෙන්න)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 2, 1);
            scene.add(directionalLight);

            // --- කැමරාව සැකසීම ---
            camera = new THREE.Camera();
            scene.add(camera);

            // --- Renderer සැකසීම ---
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0px';
            renderer.domElement.style.left = '0px';
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // --- AR.js Toolkit Source (කැමරාව) ---
            arToolkitSource = new THREEx.ArToolkitSource({
                sourceType: 'webcam',
            });

            arToolkitSource.init(function onReady() {
                onResize();
            });

            window.addEventListener('resize', function() {
                onResize();
            });

            // --- AR.js Toolkit Context (Marker හඳුනාගැනීම) ---
            arToolkitContext = new THREEx.ArToolkitContext({
                cameraParametersUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/camera_para.dat',
                detectionMode: 'mono',
            });

            arToolkitContext.init(function onCompleted() {
                camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
            });

            // --- Marker එක සහ Group එක සැකසීම ---
            // මෙහිදී අපි 'Hiro' මාකර් එක භාවිතා කරන ලෙස පවසනවා
            let markerRoot = new THREE.Group();
            scene.add(markerRoot);
            
            let markerControls = new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
                type: 'pattern',
                patternUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/patt.hiro',
            });

            // --- 3D වෙසක් කුඩුව Load කිරීම ---
            const loader = new THREE.GLTFLoader();
            
            // ඔබේ .glb file එකේ නම මෙතනට ලබා දෙන්න
            loader.load('vesak_kuduwa.glb', function(gltf) {
                kuduwaModel = gltf.scene;
                
                // කුඩුවේ ප්‍රමාණය හරිගස්සන්න (අවශ්‍ය නම් වෙනස් කරන්න)
                kuduwaModel.scale.set(0.5, 0.5, 0.5); 
                kuduwaModel.position.set(0, 0, 0);
                
                markerRoot.add(kuduwaModel);
                console.log("කුඩුව සාර්ථකව ඇතුළත් කළා!");
            }, undefined, function(error) {
                console.error("Model එක Load කිරීමේ දෝෂයක්:", error);
            });
        }

        // Window එක Resize වන විට AR එක හරියට තබා ගැනීමට
        function onResize() {
            arToolkitSource.onResizeElement();
            arToolkitSource.copyElementSizeTo(renderer.domElement);
            if (arToolkitContext.arController !== null) {
                arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
            }
        }

        // --- Animation Loop (සෑම තත්පරයකම ක්‍රියාත්මක වේ) ---
        function animate() {
            requestAnimationFrame(animate);

            if (arToolkitSource.ready === false) return;

            arToolkitContext.update(arToolkitSource.domElement);

            // කුඩුව කැරකැවීම පාලනය කරන තැන
            if (kuduwaModel) {
                // Y අක්ෂය වටා කැරකැවීම (0.5 යනු වේගයයි)
                kuduwaModel.rotation.y += 0.01; 
                
                // ඔබට මෙතනින් වෙනත් කොටස් පාලනය කිරීමේ codes පසුව එකතු කළ හැක
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
